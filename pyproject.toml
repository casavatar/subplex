[project]
name = "subplex"
version = "1.0.0"
description = "Traduce subtítulos SRT con la API de DeepL."
requires-python = ">=3.10"
dependencies = ["deepl>=1.21"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "BLE", "C901", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["main.py"]
